<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de classe e id</title>
    <style>
        .caixa{
            border:3px solid red;
            background-color: white;
            color: brown;
            padding: 10px;
        }
        #aviso{
            width: 200px;
            height: 100px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de classe id</h1>
    <p>
        Parágrafo comun da página
    </p>
    <div>Esta e uma div sem formataçaõ.</div>

    <br>

    <div class="caixa" id="aviso">
        Esta div utiliza a classe caixa e o indetificador aviso.
    </div>
    <br>

    <span>Este é um span sem formatação</span>

    <span class="caixa">
        Este é um span utilizando a classe caixa
    </span>
</body>
</html>
