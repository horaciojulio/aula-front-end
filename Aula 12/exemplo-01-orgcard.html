<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Organizando os Cards </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

</head>

<body   class= "bg-light" >
    <main class= "conteiner py-5" > 
        <h1 class= "text-center mb-4" > Aprendendo Frot-End </h1>
        <div class= "row g-5" > 
            <div class= "col-12 col-md-6" >
                <article class ="card h-100" >
                    <div class= "card-body">
                        <h2 class="card-title h3"> HTML </h2>
                        <p class = "card-text" >
                            HTML organiza o conteudo da página, como textos, titulos e etc...
                        </p>
                        <a class="btn btn-primary rounded-pill"
                        href="https://www.w3schools.com/html/"
                        > Conhecer o HTML </a>
                    </div>
                </article>
            </div>

            
            <div class= "row g-5"> 
                <article class ="card h-100">
                    <div class= "card-body">
                        <h2 class="card-title h3"> CSS </h2>
                        <p class = "card-text" > CSS organiza o estilo, como por exemplo cor da página, tamanho, fonte e entre outros </p>
                        <a class="btn btn-info rounded-pill"
                        href="https://www.w3schools.com/css/"
                        > Conhecer o CSS </a>
                    </div>
                </article>
            </div>
        </div>
    </main>

</body>
</html>
