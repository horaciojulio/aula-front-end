<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mensagem personalizada</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script src="script.js" defer></script>
  </head>

  <body class="bg-light">
    <main class="container py-5">
      <!-- Centraliza a coluna na linha -->
      <div class="row justify-content-center">
        <!-- Toda a largura em telas pequenas e metade nas maiores -->
        <div class="col-12 col-md-6">
          <section class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h3 mb-3">Mensagem personalizada</h1>

              <p>Digite seu nome para receber uma saudação.</p>

              <!-- O JavaScript acompanhará o envio deste formulário -->
              <form id="formulario">
                <div class="mb-3">
                  <label for="nome" class="form-label"> Seu nome: </label>

                  <input
                    type="text"
                    id="nome"
                    name="nome"
                    class="form-control"
                    placeholder="Digite seu nome"
                    autocomplete="given-name"
                  />
                </div>

                <button type="submit" class="btn btn-primary">
                  Mostrar mensagem
                </button>
              </form>

              <!-- Área que receberá a mensagem do JavaScript -->
              <p id="mensagem" class="mt-3 mb-0" aria-live="polite"></p>
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
