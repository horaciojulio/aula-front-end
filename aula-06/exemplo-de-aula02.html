<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo De Classes e CSS interno</title>
        <style>
            .titulo{
                color: rgb(40, 235, 82);
                text-align: center;
}
            .caixa01{
                background-color: aliceblue;
                border: 4px solid black;
                padding: 50px;
                margin: 20px;

            }
            .caixa02{
                background-color: rgb(240, 232, 232);
                border: 4px solid rgb(15, 15, 15);
                padding: 50px;
                margin: 20px;

            }
            .destaque01{
                color: coral;
                font-weight: bold;
            }
            .destaque02{
                color: rgb(230, 225, 227);
                background-color: rgb(0, 0, 0);
                font-style: italic;
                padding: 10px;
            }
            
        </style>
        
            
            

        
        
</head>
<body>
    <h1 class="titulo">Aprendendo classes em CSS</h1>
    <div class="caixa01">
<p>
    Estou aprendendo a utilizar classes para personalizar
    os elementos de uma pagina
</p>
<p class="destaque01">
    Este parágrafo utiliza a classe destaque01
</p>
</div>
<div class="caixa02">
<p class="destaque02">
    Este parágrafo utiliza a classe destaque02
</p>


    </div>

</body>
</html>0
