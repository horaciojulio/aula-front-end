<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tabelas </title>
</head>
<body>
    <h1> Exemplo de tabelas </h1>
    <p>
        As tabelas em html são usadas para organizar dados
    </p>

    <table border="7">
        <thead>
            <tr>
                <th> Nome </th>
                <th> Idade </th>
                <th> Cidade </th>
            </tr>
        </thead>
    
        <tbody>
            <tr>
                <td> Julio </td>
                <td> 19  </td>
                <td>  Guarulhos  </td>
            </tr>
        </tbody>

        <tbody>
            <tr>
                <td> Paulo </td>
                <td> 22  </td>
                <td>  São Paulo  </td>
            </tr>
        </tbody>



    </table>
</body>
</html>
