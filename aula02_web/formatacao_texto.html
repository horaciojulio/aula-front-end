<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatação de texto </title>
</head>
<body>
    <h1>Formatação de texto</h1>
    <p> Para fazermos formatação de texto utilizamos alguns comandos, por exemplo, strong (Negrito), em (Itálico), u (Sublinhado), s (tachado) e outros</p>
    <ul> 
        <li><strong>Negrito</strong></li>
        <li><em> Itálico </em></li>
        <li><u>Sublinhado</u></li>
        <li><s>tachado</s></li>
    </ul>

    
    
</body>
</html>
