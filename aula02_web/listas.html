<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Listas</h1>
    <p> Utilizamos as listas para organizar sequencias, existem 2 tipos de listas as <strong>não ordenadas (ul) e ordenadas (ol) e ambas usam li para cada item</strong></p>
    <h2>Exemplos ordenadas</h2>
    <ol>
        <li>Arroz</li>
        <li>Feijão</li>
        <li>Batata</li>
        <li>Frango</li>
    </ol>

    <h2>Exemplo não ordenadas</h2>
    <ul>
        <li>Macarrão</li>
        <li>Carne</li>
        <li>Farofa</li>
        <li>Almondegas</li>
    </ul>

    
</body>
</html>
